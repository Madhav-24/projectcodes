model:
  name: "yolo_v5"
  weights: "path/to/weights/yolo_v5_weights.pt"
  confidence_threshold: 0.5
  nms_threshold: 0.4

detection:
  ppe_detection:
    helmet_required: true
    vest_required: true
  intrusion_detection:
    worker_label: "worker"
    intruder_label: "intruder"

data:
  input_source: "data/raw"
  output_results: "data/processed/results"
  batch_size: 16
  image_size: [640, 640]

training:
  epochs: 50
  learning_rate: 0.001
  optimizer: "adam"
  loss_function: "cross_entropy"